version: "3.8"

services:
  agent-api:
    build: .
    container_name: ai-agent-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      # 挂载数据目录，方便存取 input.csv / output.csv
      - ./data:/app/data
    restart: unless-stopped
    # 健康检查（配合 HEALTHCHECK 指令使用）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
